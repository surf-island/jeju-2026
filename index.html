  var KEY="jeju-lock-"+SALT.slice(0,10);
  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  var toB64=function(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
  var form=document.getElementById("lock"),pw=document.getElementById("pw"),go=document.getElementById("go"),err=document.getElementById("err");
  function show(html){var go=function(){document.open();document.write(html);document.close()};if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(go,0)});else setTimeout(go,0)}
  function decrypt(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT)).then(function(pt){return new TextDecoder().decode(pt)})}
  function ask(){form.hidden=false;pw.focus()}

  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){

      .then(show)
