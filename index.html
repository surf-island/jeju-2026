<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>濟州冬日七日行</title>
<style>
/* lock screen: one stitched card, tangerine accent, follows light/dark */
:root{--bg:#FFF4E8;--card:#FFFCF7;--ink:#4A2E22;--muted:#8C6E5C;--line:#F0D6BC;--tang:#F28A2E;--leaf:#5DAE6B;--stitch:#F2B98A;--err:#C23F39;--btn-ink:#3A1E0C;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1E2142;--card:#292E54;--ink:#F1EAFF;--muted:#B9B2D6;--line:#41477A;--tang:#FFA05A;--leaf:#6FC48A;--stitch:#5A619A;--err:#FF8A8A;--btn-ink:#2A1405;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.box{position:relative;width:min(360px,100%);background:var(--card);border:2px solid var(--line);border-radius:24px;padding:30px 24px 24px;box-shadow:0 5px 0 var(--line);display:grid;gap:14px;text-align:center}
.box::after{content:"";position:absolute;inset:6px;border:2px dashed var(--stitch);border-radius:18px;pointer-events:none}
.box svg{justify-self:center}
h1{margin:0;font-size:22px;letter-spacing:.02em;text-wrap:balance}
p{margin:0;color:var(--muted);font-size:13.5px}
input[type=password]{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;position:relative;z-index:1}
input[type=password]:focus-visible{outline:3px solid var(--tang);outline-offset:1px}
.rem{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13.5px;color:var(--muted);position:relative;z-index:1}
.rem input{width:18px;height:18px;accent-color:var(--tang);margin:0}
button{position:relative;z-index:1;font-family:inherit;font-weight:600;font-size:16px;line-height:1;padding:14px;border:0;border-radius:999px;background:var(--tang);color:var(--btn-ink);cursor:pointer}
button:disabled{opacity:.65;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{color:var(--err);font-size:13.5px;min-height:1.3em}
[hidden]{display:none!important}
</style>
</head>
<body>
<form class="box" id="lock" hidden>
  <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="31" r="20" fill="var(--tang)"/><path d="M28 12c4-7 12-8 16-5-4 6-11 7-16 5z" fill="var(--leaf)"/><path d="M28 12v-3" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/><circle cx="21" cy="25" r="3" fill="#fff" opacity=".55"/></svg>
  <h1>濟州冬日七日行</h1>
  <p>這是私人行程，請輸入密碼打開。</p>
  <input type="password" id="pw" placeholder="密碼" aria-label="密碼" autocomplete="current-password" required>
  <label class="rem"><input type="checkbox" id="rem" checked> 在這台裝置記住</label>
  <button type="submit" id="go">打開行程</button>
  <div class="err" id="err" role="alert"></div>
</form>

  var KEY="jeju-lock-"+SALT.slice(0,10);
  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  var toB64=function(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
  var form=document.getElementById("lock"),pw=document.getElementById("pw"),go=document.getElementById("go"),err=document.getElementById("err");
  function show(html){document.open();document.write(html);document.close()}
  function decrypt(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT)).then(function(pt){return new TextDecoder().decode(pt)})}
  function ask(){form.hidden=false;pw.focus()}
  if(!window.crypto||!crypto.subtle){form.hidden=false;err.textContent="這個瀏覽器不支援解密，請用 Safari 或 Chrome 打開。";go.disabled=true;return}
  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){
    crypto.subtle.importKey("raw",b64(saved),"AES-GCM",false,["decrypt"]).then(decrypt).then(show).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}ask()});
  }else ask();
  form.addEventListener("submit",function(ev){
    ev.preventDefault();err.textContent="";go.disabled=true;go.textContent="解鎖中…";
    var key;
    crypto.subtle.importKey("raw",new TextEncoder().encode(pw.value),"PBKDF2",false,["deriveKey"])
      .then(function(base){return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])})

        return html})
      .then(show)
      .catch(function(){go.disabled=false;go.textContent="打開行程";err.textContent="密碼不對，再試一次。";pw.select()});
